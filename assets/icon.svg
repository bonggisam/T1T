<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- 둥근 사각형 배경 (그라데이션) -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A90E2"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="220" ry="220" fill="url(#bg)"/>
  <!-- 캘린더 상단 후크 -->
  <rect x="280" y="200" width="60" height="120" rx="20" fill="rgba(255,255,255,0.85)"/>
  <rect x="684" y="200" width="60" height="120" rx="20" fill="rgba(255,255,255,0.85)"/>
  <!-- T1T 텍스트 -->
  <text x="512" y="690"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif"
        font-size="380"
        font-weight="900"
        fill="#fff"
        text-anchor="middle"
        letter-spacing="-12">T1T</text>
</svg>
