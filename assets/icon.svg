<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- 메인 배경: 짙은 슬레이트 → 인디고 → 청록 그라데이션 (어두운 바탕에도 잘 어울림) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0F172A"/>
      <stop offset="50%"  stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F2942"/>
    </linearGradient>
    <!-- T1T 텍스트 그라데이션 (시안→블루 — 모던하고 가독성 좋음) -->
    <linearGradient id="text" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <!-- 1 의 강조 색 -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <!-- 텍스트 라이트 효과 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 둥근 사각형 배경 -->
  <rect x="32" y="32" width="960" height="960" rx="240" ry="240" fill="url(#bg)"/>

  <!-- 미묘한 하이라이트 (좌상단 빛) -->
  <ellipse cx="320" cy="280" rx="280" ry="200" fill="rgba(99,102,241,0.18)" filter="url(#glow)"/>

  <!-- 하단 굵은 액센트 라인 (브랜드감) -->
  <rect x="220" y="850" width="584" height="14" rx="7" fill="url(#text)" opacity="0.6"/>

  <!-- T1T 텍스트 — 모노스페이스 풍 큰 글자 -->
  <text x="512" y="620"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif"
        font-size="360"
        font-weight="900"
        text-anchor="middle"
        letter-spacing="-8"
        filter="url(#glow)">
    <tspan fill="url(#text)">T</tspan>
    <tspan fill="url(#accent)">1</tspan>
    <tspan fill="url(#text)">T</tspan>
  </text>
</svg>
